version: '3.8'

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: feed-clone-db
    restart: always
    environment:
      POSTGRES_DB: feed_clone
      POSTGRES_USER: feeduser
      POSTGRES_PASSWORD: feedpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d # Auto-run migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeduser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feed-clone-net

  # ==================== BACKEND ====================
  # backend:
  #   build:
  #     context: ./backend
  #     # dockerfile: Dockerfile
  #   container_name: feed-clone-api
  #   environment:
  #     DATABASE_URL: postgresql://feeduser:feedpass123@localhost:5432/feed_clone
  #     RUST_LOG: info
  #     API_PORT: 3001
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend/src:/app/src # Hot-reload (optional)
  #   networks:
  #     - feed-clone-net
  #   restart: unless-stopped

  # ==================== FRONTEND ====================
  # frontend:
  #   build:
  #     context: ./frontend/webapp
  #     # dockerfile: Dockerfile
  #   container_name: feed-clone-web
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:3001
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend/webapp:/app
  #     - /app/node_modules # Prevent node_modules from being mounted
  #   networks:
  #     - feed-clone-net
  #   restart: unless-stopped

  # ==================== TOOLS ====================
  # Swagger UI cho API docs
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: feed-clone-swagger
    restart: always
    environment:
      SWAGGER_JSON_URL: http://localhost:3000/api-docs/openapi.json
      SWAGGER_JSON: /swagger.json
      BASE_URL: /swagger
    ports:
      - "8081:8081"
    volumes:
      - ./backend/swagger.json:/usr/share/nginx/html/swagger.json
    networks:
      - feed-clone-net
    depends_on:
      - postgres
    #   - backend

  # pgAdmin - GUI cho PostgreSQL (optional nhưng rất tiện)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: feed-clone-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - feed-clone-net
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  feed-clone-net:
    driver: bridge
